<text x="200" y="883" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#000000" text-anchor="start">Socket = required service    Circle = provided service</text>
<text x="200" y="909" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#333333" text-anchor="start">Solid assembly connector joins matching interfaces; squares are ports.</text>
<text x="60" y="964" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="700" fill="#000000" text-anchor="start">Interaction and security notes</text>
<text x="60" y="994" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="400" fill="#333333" text-anchor="start">Paired devices send timestamped readings; ingestion rejects invalid data and duplicates.</text>
<text x="60" y="1021" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="400" fill="#333333" text-anchor="start">Alert service persists pending alerts; delivery retries run independently of ingestion.</text>
<text x="60" y="1048" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="400" fill="#333333" text-anchor="start">Acknowledgement stops escalation; history and threshold edits use the Data API.</text>
<text x="60" y="1075" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="400" fill="#333333" text-anchor="start">Services verify signed tokens and patient access; internal calls use service credentials.</text>
<text x="60" y="1102" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="400" fill="#333333" text-anchor="start">Ingestion tracks inactivity and recovery; Data API supplies stale status and audit events.</text>
<text x="60" y="1148" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="700" fill="#000000" text-anchor="start">Targets: detection within 2 seconds • 500 streams • 99.99% monthly gateway availability</text>
<text x="60" y="1175" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="700" fill="#000000" text-anchor="start">Security: TLS 1.2+ • AES-256 at rest • assigned-patient access control • auditable changes</text>
</svg>